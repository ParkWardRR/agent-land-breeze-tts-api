name: Build and Release macOS CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: |
          cd tools/breeze
          swift build -c release
          cp .build/release/breeze ../../breeze
          cd ../..
          file breeze
          ls -lh breeze

      - name: Code sign with Developer ID
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Decode and import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Sign the binary
          IDENTITY="Developer ID Application: Twesh Deshetty ($APPLE_TEAM_ID)"
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" breeze
          codesign --verify --verbose breeze

          # Clean up
          rm certificate.p12

      - name: Ad-hoc sign (fallback)
        if: env.APPLE_CERTIFICATE == ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          codesign --force --sign - breeze
          echo "Warning: ad-hoc signed only (no Developer ID secrets configured)"

      - name: Notarize
        if: env.APPLE_CERTIFICATE != '' && env.APPLE_ID != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Create a ZIP for notarization
          ditto -c -k --keepParent breeze breeze.zip

          # Submit for notarization
          xcrun notarytool submit breeze.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # Staple (only works on .app/.dmg/.pkg, skip for bare binary)
          echo "Notarization complete. Bare binaries can't be stapled but are notarized."
          rm breeze.zip

      - name: Package release artifact
        run: |
          tar czf breeze-macos-arm64.tar.gz breeze
          shasum -a 256 breeze-macos-arm64.tar.gz > breeze-macos-arm64.tar.gz.sha256
          cat breeze-macos-arm64.tar.gz.sha256

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            breeze-macos-arm64.tar.gz
            breeze-macos-arm64.tar.gz.sha256
          body: |
            ## macOS CLI (`breeze`)

            Download `breeze-macos-arm64.tar.gz`, extract, and run:

            ```bash
            tar xzf breeze-macos-arm64.tar.gz
            ./breeze configure    # detect hardware, write .env
            ./breeze download     # fetch model weights
            ./breeze launch       # start the TTS server
            ```

            Requires Apple Silicon (M1+) and Python 3.12+ (`brew install python@3.12 sox`).

      - name: Upload artifact (non-tag builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: breeze-macos-arm64
          path: breeze-macos-arm64.tar.gz
